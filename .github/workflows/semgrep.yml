name: Semgrep Scan

on:
  workflow_call:
    inputs:
      config:
        description: Semgrep config to use.
        required: false
        type: string
        default: auto
      fail-on-findings:
        description: Whether to fail the workflow when Semgrep finds issues.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Run Semgrep
        env:
          SEMGREP_SEND_METRICS: "off"
          SEMGREP_CONFIG: ${{ inputs.config }}
        run: |
          if [ "${{ inputs.fail-on-findings }}" = "true" ]; then
            semgrep scan --config="$SEMGREP_CONFIG" --error .
          else
            semgrep scan --config="$SEMGREP_CONFIG" .
          fi
